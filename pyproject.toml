[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-fuse"
version = "0.1.0"
description = "XRD Fusion toolkit integrating FeatUp and HR-Dv2 models"

[tool.uv.workspace]
members = [
    "FeatUp",
    "HR-Dv2",
]

[tool.uv]
python-version = "3.10"

# Platform-specific and reproducible dependency handling
# On macOS: uses CPU-only PyTorch
# On Linux: uses CUDA-capable PyTorch
# Users can override with: uv sync --override torch=torch[cu121] for specific CUDA versions
[tool.uv.sources]
torch = [
    { url = "https://download.pytorch.org/whl/cpu/torch-2.1.2+cpu-cp310-cp310-macosx_12_0_arm64.whl", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://download.pytorch.org/whl/cpu/torch-2.1.2+cpu-cp310-cp310-macosx_12_0_x86_64.whl", markers = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { url = "https://download.pytorch.org/whl/cu121/torch-2.1.2+cu121-cp310-cp310-linux_x86_64.whl", markers = "sys_platform == 'linux'" },
]
