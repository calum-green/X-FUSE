[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-fuse"
version = "0.1.0"
description = "XCT and XRDCT Fusion Toolkit"
requires-python = ">=3.10"
authors = [
    { name = "Calum Green", email = "calum.green17@imperial.ac.uk" },
]
dependencies = [
    "clip>=0.2.0",
    "featup",
    "flake8>=7.3.0",
    "h5py>=3.16.0",
    "hr_dv2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "open-clip-torch>=3.3.0",
    "opencv-python>=4.13.0.92",
    "porespy>=3.0.2",
    "pytest>=9.0.3",
    "sam2>=1.1.0",
    "termcolor>=3.3.0",
    "torch<=2.6",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.0",
    "xformers>=0.0.29.post3",
    "flash-attn",
]
cpu = [
    "torch>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "ipython>=7.0",
    "jupyter>=1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
featup = { workspace = true }
hr_dv2 = { workspace = true }

[tool.uv.workspace]
members = [
    "FeatUp",
    "HR-Dv2",
]
